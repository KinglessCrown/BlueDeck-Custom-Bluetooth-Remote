name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0 (leave empty to only build)"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "BlueDeck-${VERSION:-dev}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BlueDeck-apk
          path: BlueDeck-*.apk
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "BlueDeck-$VERSION.apk" \
            --title "BlueDeck $VERSION" --generate-notes \
            --notes "Install the APK on Android 7.0+ and allow installs from unknown sources."
